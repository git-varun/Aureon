services:
  aureon-db:
    image: postgres:16-alpine
    container_name: aureon_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aureon}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aureon_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: aureon_redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aureon_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot: applies backend/prisma/migrations to aureon-db and exits.
  # Prisma is the canonical schema source (Task 9 retired Alembic and Task
  # 10 deleted backend/ entirely — see CLAUDE.md's Database migrations
  # section) — nothing else creates schema on a fresh Postgres volume, so
  # backend/backend-worker both wait on this completing
  # successfully before they start.
  migrate:
    image: oven/bun:1-alpine
    container_name: aureon_migrate
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@aureon-db:5432/${POSTGRES_DB:-aureon}?options=-c%20timezone%3Dutc
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      aureon-db:
        condition: service_healthy
    networks:
      - aureon_network
    command: sh -c "bun install && bunx prisma migrate deploy"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: oven/bun:1-alpine
    container_name: aureon_backend
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@aureon-db:5432/${POSTGRES_DB:-aureon}?options=-c%20timezone%3Dutc
      REDIS_URL: redis://redis:6379/0
      PORT: "8010"
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    depends_on:
      aureon-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - aureon_network
    command: sh -c "bun install && bun run dev"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # BullMQ worker for backend's jobs (currently: q_ingestion,
  # q_watchlist_alerts, q_scheduled_jobs). No repeatable schedule is
  # registered on q_ingestion/q_watchlist_alerts — those only get jobs from
  # backend's own manual trigger scripts or its ingestQuote/
  # refreshTrackedUniverse paths. q_scheduled_jobs carries all of this app's
  # repeatable schedules (10 as of Task 10: sweep-stale-job-logs,
  # refresh-tracked-universe, refresh-mutual-fund-navs, seed-price-history,
  # hourly-price-refresh, daily/weekly/monthly-briefing,
  # refresh-fundamentals, news-refresh) — registered in src/queue.ts, see
  # backend/scripts/startWorker.ts for the full registration list. This
  # fully replaces Python's celery_beat, which is gone along with the rest
  # of backend/.
  backend-worker:
    image: oven/bun:1-alpine
    container_name: aureon_backend_worker
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@aureon-db:5432/${POSTGRES_DB:-aureon}?options=-c%20timezone%3Dutc
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      aureon-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - aureon_network
    command: sh -c "bun install && bun run worker"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: oven/bun:1-alpine
    container_name: aureon_frontend
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://backend:8010
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      backend:
        condition: service_started
    networks:
      - aureon_network
    command: sh -c "bun install && bun run dev"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  postgres_data:
  redis_data:

networks:
  aureon_network:
    driver: bridge
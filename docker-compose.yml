x-backend-common: &backend-common
  build:
    context: ./backend
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@aureon-db:5432/${POSTGRES_DB:-aureon}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./backend:/app
    - /app/.venv
  depends_on:
    aureon-db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - aureon_network
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  aureon-db:
    image: postgres:16-alpine
    container_name: aureon_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aureon}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aureon_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: aureon_redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aureon_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    <<: *backend-common
    container_name: aureon_api
    ports:
      - "${API_PORT:-8002}:8002"
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8002 --workers 2
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/api/v1/health" ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  celery_worker:
    <<: *backend-common
    container_name: aureon_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q q_ingestion,celery
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  celery_beat:
    <<: *backend-common
    container_name: aureon_celery_beat
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/app/data/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/data/celerybeat-schedule || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    image: node:22-alpine
    container_name: aureon_frontend
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://api:8002
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aureon_network
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  postgres_data:
  redis_data:

networks:
  aureon_network:
    driver: bridge
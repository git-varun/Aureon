[project]
name = "aureon-api"
version = "0.1.0"
description = "Aureon API Sprint 1A"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "sqlalchemy==2.0.50",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.4",
    "redis==8.0.0",
    "pydantic-settings==2.14.1",
    "pydantic==2.13.4",
    "celery==5.6.3",
    "pyjwt==2.13.0",
    "bcrypt==5.0.0",
    "cryptography==49.0.0",
    "google-auth==2.54.0",
    "email-validator==2.3.0",
    "yfinance==1.4.1",
    "requests==2.34.2",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.9",
    "psutil>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.16",
    "mypy==2.1.0",
    "pre-commit==4.6.0"
]

[tool.pytest.ini_options]
addopts = "-v --asyncio-mode=auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
strict = true
ignore_missing_imports = true

x-backend-test-common: &backend-test-common
  build:
    context: ./backend
    target: test
  environment: &backend-test-env
    TESTING: "true"
    DATABASE_URL: postgresql+psycopg://postgres:postgres@aureon-test-db:5432/aureon_test
    TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@aureon-test-db:5432/aureon_test
    REDIS_URL: redis://aureon-test-redis:6379/0
    CELERY_BROKER_URL: redis://aureon-test-redis:6379/0
    CELERY_RESULT_BACKEND: redis://aureon-test-redis:6379/1
    SECRET_KEY: test-secret-key-not-for-production-use-only-in-ci
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./backend:/app
    - /app/.venv
  depends_on:
    aureon-test-db:
      condition: service_healthy
    aureon-test-redis:
      condition: service_healthy
  networks:
    - aureon_test_network

services:
  aureon-test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aureon_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aureon_test_network

  aureon-test-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aureon_test_network

  backend:
    <<: *backend-test-common
    command: sh -c "alembic upgrade head && pytest tests/ -q"

  celery_worker:
    <<: *backend-test-common
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q q_ingestion,celery
    profiles:
      - with-worker

networks:
  aureon_test_network:
    driver: bridge

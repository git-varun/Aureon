name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    # Isolated PostgreSQL + Redis for this job only — destroyed automatically when the job ends.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aureon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aureon
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-for-production-use-only-in-ci

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        cd backend-node
        npm ci

    - name: Run ESLint
      run: |
        cd backend-node
        npm run lint

    - name: Run TypeScript typecheck
      run: |
        cd backend-node
        npx tsc --noEmit -p .

    - name: Apply Prisma schema
      run: |
        cd backend-node
        npx prisma migrate deploy

    - name: Run Vitest Suite
      run: |
        cd backend-node
        npm test

name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      # Optional: set up Redis service if required by any integration checks,
      # though unit tests mock Redis, it's good practice for CI readiness.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run Ruff Linter
      run: |
        cd backend
        ruff check .

    - name: Run Mypy Typecheck
      run: |
        cd backend
        mypy .

    - name: Validate Alembic Migrations
      run: |
        cd backend
        alembic upgrade head

    - name: Run Pytest Suite
      run: |
        cd backend
        pytest
